name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Generated code matches openapi.json
        run: npm run check-generated
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Built package loads as ESM and CommonJS
        run: |
          node --input-type=module -e "import { Layrcake, VERSION } from 'layrcake'; if (typeof Layrcake !== 'function') process.exit(1); console.log('esm', VERSION)"
          node -e "const { Layrcake, VERSION } = require('layrcake'); if (typeof Layrcake !== 'function') process.exit(1); console.log('cjs', VERSION)"
      - name: Package contents
        run: npm pack --dry-run
